---

- name: Create temporary directory
  ansible.windows.win_tempfile:
    state: directory
  changed_when: false
  register: __tmpdir

- name: Distribute all root CA certificates
  ansible.windows.win_copy:
    src: "{{ item.src }}"
    dest: "{{ dest }}"
  changed_when: false
  register: __copied
  loop: "{{ __rootca_certificates }}"
  loop_control:
    label: "{{ label }}"
  vars:
    label: "{{ item.src | basename | regex_replace('\\.(pem|crt)$') }}"
    dest: "{{ __tmpdir.path }}\\{{ item.src | basename | regex_replace('\\.(pem|crt)$', '') }}.{{ rootca_ext }}"

- name: Remove obsolete certificates
  ansible.windows.win_certificate_store:
    path: "{{ item.dest }}"
    file_type: pem
    store_location: LocalMachine
    store_name: Root
    state: absent
  when: item.item.state == 'absent'
  loop: "{{ __copied.results }}"
  loop_control:
    label: "{{ item.dest | win_basename | regex_replace('\\.'~rootca_ext, '') }}"

- name: Install certificates
  ansible.windows.win_certificate_store:
    path: "{{ item.dest }}"
    file_type: pem
    store_location: LocalMachine
    store_name: Root
    state: present
  when: item.item.state == 'present'
  loop: "{{ __copied.results }}"
  loop_control:
    label: "{{ item.dest | win_basename | regex_replace('\\.'~rootca_ext, '') }}"

- name: Remove temporary directory
  ansible.windows.win_file:
    path: "{{ __tmpdir.path }}"
    state: absent
  changed_when: false
